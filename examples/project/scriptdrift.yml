# Example ScriptDrift project used by docker-compose.yml.
# Copy this directory, point SCRIPTDRIFT_PROJECT_DIR at it, and edit the sites.
version: 1

defaults:
  browser:
    profile: desktop-chromium
  scan:
    timeout: 60000
    waitUntil: networkidle
    settleMs: 3000

sites:
  - name: example
    url: https://example.com
    pages:
      - /
    sensitivePages: []

failOn: high

alerts:
  minSeverity: medium
  slack:
    enabled: false
    webhookUrl: ${SCRIPTDRIFT_SLACK_WEBHOOK}
  webhook:
    enabled: false
    url: ${SCRIPTDRIFT_WEBHOOK_URL}
    secret: ${SCRIPTDRIFT_WEBHOOK_SECRET}
